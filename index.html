<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A kortes bora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: egy keskeny történet-oszlop egy „éjszakai óra” idővonal alatt (Este 6 → Dél); jelenetlap, két döntési kártya, alatta rövid fogalmi kvíz. Hivatali papír + vasgallusz-tinta + borvörös pecsét. */
:root{
  --bg:#E9ECEB; --surface:#FBFCFA; --sunk:#E1E6E4; --ink:#1B2330; --muted:#566170; --line:#CDD4D6;
  --wine:#7E1D35; --wine-soft:#F2DDE2; --wine-ink:#FFFFFF;
  --gold:#9C7420; --gold-soft:#F4EAD2;
  --good:#2C6A47; --good-soft:#DCEFE3; --bad:#A3382B; --bad-soft:#F6E0DC;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --sunk:#232B36; --ink:#E7EAEE; --muted:#9FA9B6; --line:#333D4A;
  --wine:#E3809A; --wine-soft:#3A1C25; --wine-ink:#1A0A10;
  --gold:#D9B25E; --gold-soft:#33291A;
  --good:#63C18D; --good-soft:#163426; --bad:#EE8273; --bad-soft:#3C1E1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --sunk:#232B36; --ink:#E7EAEE; --muted:#9FA9B6; --line:#333D4A;
  --wine:#E3809A; --wine-soft:#3A1C25; --wine-ink:#1A0A10;
  --gold:#D9B25E; --gold-soft:#33291A;
  --good:#63C18D; --good-soft:#163426; --bad:#EE8273; --bad-soft:#3C1E1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;padding-inline:16px;padding-block:20px 70px}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);font-weight:800;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,9vw,3.8rem);color:var(--wine)}
h2{font-size:1.75rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .brand{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:1.15rem;color:var(--wine);margin-right:auto}
.chip{font-family:var(--f-mono);font-size:.8rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-variant-numeric:tabular-nums}
.chip.score{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.ghost{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 13px;font-size:.92rem}
.ghost:hover{border-color:var(--wine)}

/* éjszakai óra */
.clock{display:flex;justify-content:space-between;position:relative;padding-top:4px}
.clock::before{content:"";position:absolute;left:12px;right:12px;top:14px;height:2px;background:var(--line)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;max-width:58px}
.stop i{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line);display:block}
.stop.done i{background:var(--ink);border-color:var(--ink)}
.stop.now i{background:var(--wine);border-color:var(--wine);box-shadow:0 0 0 5px var(--wine-soft)}
.stop.now{color:var(--ink);font-weight:700}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:24px;position:relative}
.meta{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.story{display:flex;flex-direction:column;gap:14px}
.story p{max-width:64ch}
.story .lede::first-letter{font-family:var(--f-display);font-weight:800;color:var(--wine);float:left;font-size:3.3rem;line-height:.85;padding:4px 8px 0 0}
.v{background:none;border:0;padding:0 1px;font:inherit;color:inherit;text-align:left;display:inline;cursor:help;
   border-bottom:2px dotted var(--wine);background-image:linear-gradient(transparent 62%,var(--wine-soft) 62%)}
.v:hover{background-image:linear-gradient(var(--wine-soft),var(--wine-soft))}

.choices{display:grid;gap:12px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:16px 18px;transition:transform .12s,border-color .12s}
.choice:hover:not(:disabled){border-color:var(--wine);transform:translateY(-2px)}
.choice .k{font-family:var(--f-display);font-weight:800;font-size:1.35rem;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--wine-soft);color:var(--wine)}
.choice > span:last-child{min-width:0}
.choice.picked{border-color:var(--wine);background:var(--sunk)}
.choice:disabled{cursor:default;transform:none}
.choice.faded{opacity:.45}
.outcome{border-left:3px solid var(--wine);padding:4px 0 4px 16px;font-style:italic;max-width:64ch}

.quiz{background:var(--sunk);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:18px}
.quiz h3{margin:0;font-size:.8rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--wine)}
.q{display:flex;flex-direction:column;gap:10px}
.q .prompt{font-weight:700}
.q .pts{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:500;margin-left:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--wine)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.typerow{display:flex;gap:8px;flex-wrap:wrap}
.typerow input,.field{flex:1 1 180px;min-width:0;font:inherit;padding:10px 12px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{background:var(--ink);color:var(--surface);border:0;border-radius:4px;padding:10px 18px;font-weight:700}
.btn.big{font-size:1.05rem;padding:14px 24px}
.btn.wine{background:var(--wine);color:var(--wine-ink)}
.btn:disabled{opacity:.4;cursor:default}
.fb{font-size:.96rem;border-radius:4px;padding:8px 12px}
.fb.ok{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .hint{color:var(--muted);font-size:.92rem}

/* kezdőlap */
.seal{position:absolute;top:18px;right:18px;width:78px;height:78px;border-radius:50%;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:.72rem;line-height:1.05;transform:rotate(-12deg);box-shadow:inset 0 0 0 4px var(--wine),inset 0 0 0 5.5px var(--wine-ink)}
.seal b{display:block;font-size:1.2rem}
@media (max-width:480px){.seal{width:62px;height:62px;font-size:.6rem;top:12px;right:12px}.seal b{font-size:1rem}}
.start h1{padding-right:84px}
.lead{font-size:1.14rem;max-width:60ch}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.who{background:var(--sunk);border-radius:4px;padding:10px 12px;font-size:.94rem;line-height:1.35}
.who b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.08rem;color:var(--wine)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
textarea{width:100%;min-height:120px;font:inherit;padding:12px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.big-score{font-family:var(--f-display);font-weight:800;font-size:3.4rem;color:var(--wine);line-height:1;font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.tally span:nth-child(even){font-family:var(--f-mono);font-weight:700;text-align:right}
.path{margin:0;padding-left:20px;color:var(--muted);font-size:.94rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-family:var(--f-mono);font-size:.76rem;background:var(--good-soft);border:1px solid var(--good);border-radius:4px;padding:3px 9px}
.motives{display:grid;gap:8px}
.mot{display:grid;grid-template-columns:minmax(0,10rem) 1fr auto;gap:10px;align-items:center;font-size:.95rem}
.mot .track{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.mot .track i{display:block;height:100%;background:var(--gold)}
.mot .n{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.history{display:flex;flex-direction:column;gap:10px}
.history li{margin-bottom:4px}
.history ul{margin:0;padding-left:20px}

.gloss{display:grid}
.gloss div{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.gloss div:last-child{border-bottom:0}
.gloss .gh{margin:18px 0 2px;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.gloss .gh:first-child{margin-top:4px}
.gloss .t{font-family:var(--f-display);font-weight:700;color:var(--wine)}
.gloss .n{grid-column:2;font-size:.88rem;color:var(--muted)}
@media (max-width:480px){.gloss div{grid-template-columns:1fr}.gloss .n{grid-column:1}}
#tip{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:4px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:5;display:flex;gap:12px;align-items:flex-start;font-size:.98rem;line-height:1.4}
#tip b{color:var(--gold)}
#tip button{margin-left:auto;background:none;border:0;color:var(--bg);font-size:1.3rem;line-height:1}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.choice{transition:none}}
</style>

<div class="wrap">
  <div class="bar">
    <span class="brand">Nagykálló, 1847</span>
    <span class="chip score" id="score">0 pont</span>
    <button class="ghost" id="glossBtn" type="button">Fogalomtár</button>
  </div>
  <div class="clock" id="clock" hidden></div>
  <main id="app" class="wrap" style="gap:18px"></main>
  <section class="card" id="glossary" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2>Fogalomtár</h2><button class="ghost" type="button" id="glossClose">Bezár</button></div>
    <div class="gloss" id="glossList"></div>
  </section>
</div>
<div id="tip" hidden></div>

<script>
/* ---------- Fogalmak ---------- */
const V={
 kovetutasitas:{t:"követutasítás",d:"A vármegyei közgyűlés írásos utasítása a megye két országgyűlési követének: hogyan szavazzanak az egyes ügyekben.",n:"Kötött mandátum: a követ nem dönthetett szabadon, és a megye visszahívhatta."},
 kozgyules:{t:"vármegyei közgyűlés",d:"A nemesi vármegye döntéshozó gyűlése, ahol a megye nemesei megjelenhettek és szavazhattak.",n:"Itt választották a követeket és adták ki a követutasítást."},
 bocskoros:{t:"bocskoros nemes",d:"Földdel alig vagy egyáltalán nem rendelkező, saját kezével dolgozó kisnemes; gúnynevei: hétszilvafás, kutyabőrös nemes.",n:"Életmódja a parasztéhoz hasonlított, de a közgyűlésen szavazott."},
 kortes:{t:"kortes",d:"Választási ügynök, aki ígérettel, étellel-itallal, pénzzel szerez szavazatokat egy párt vagy jelölt számára.",n:"A kortesvacsora és a kortesbor a reformkori vármegyei élet ismert eszköze volt."},
 adomentesseg:{t:"nemesi adómentesség",d:"A nemesség legfontosabb anyagi kiváltsága: nem fizetett hadiadót és házi adót.",n:"A szegény nemesnek gyakran ez volt az egyetlen kézzelfogható előjoga."},
 kozteher:{t:"közteherviselés",d:"Az elv, hogy az adót minden lakos, a nemes is, vagyona arányában viselje.",n:"A liberális ellenzék fő követelése; 1848-ban törvény lett (VIII. tc.)."},
 haziado:{t:"házi adó",d:"A vármegye működésének költségeit fedező adó, amelyet csak az adózó nép, főként a jobbágyság fizetett.",n:"Az 1840-es években vita folyt arról, hogy vállalja-e a nemesség is."},
 adminisztrator:{t:"adminisztrátori rendszer",d:"1845-től a kormány számos megyébe a főispán helyett helytartót (adminisztrátort) küldött, hogy kormánypárti többséget szervezzen.",n:"Apponyi György kancellár politikája; az ellenzék a megyei önkormányzat megsértésének tartotta."},
 konzervativ:{t:"Konzervatív Párt",d:"1846-ban alakult kormánypárt: fokozatos, az udvarral egyeztetett reformokat akart a rendi berendezkedés lényegének megőrzésével.",n:"Vezetői közé tartozott Dessewffy Emil és Apponyi György."},
 ellenzeki:{t:"Ellenzéki Nyilatkozat",d:"Az 1847-ben alakult Ellenzéki Párt programja, fő szerkesztője Deák Ferenc; a párt elnöke Batthyány Lajos.",n:"Követelte a közteherviselést, a kötelező örökváltságot állami kármentesítéssel, a népképviseletet, az ősiség eltörlését."},
 orokvaltsag:{t:"örökváltság",d:"A jobbágy egyszeri összeggel megváltja magát az úrbéri terhek alól, telke saját tulajdonává válik.",n:"1840-től önkéntes formában törvényes; az ellenzék kötelezővé tételét és állami kármentesítést kért."},
 nepkepviselet:{t:"népképviselet",d:"Az országgyűlést nem a rendek küldik, hanem vagyon vagy műveltség alapján választójogot kapó polgárok választják.",n:"Az 1848: V. tc. vezette be."},
 osiseg:{t:"ősiség",d:"1351 óta érvényes elv: a nemesi birtok nem adható el végleg, a nemzetség tulajdona marad.",n:"Akadályozta a hitelfelvételt; Széchenyi a Hitelben (1830) bírálta."},
 erdekegyesites:{t:"érdekegyesítés",d:"Wesselényi Miklós és Kossuth Lajos elve: a nemesség önként mondjon le kiváltságairól, és egyesítse érdekét a nép érdekével.",n:"Célja a jobbágyság nemzetbe emelése volt."},
 pestihirlap:{t:"Pesti Hírlap",d:"Kossuth Lajos szerkesztésében 1841-től megjelenő lap, a reformellenzék szócsöve.",n:"Vezércikkei a vármegyékben is vitákat indítottak."},
 felkialtas:{t:"felkiáltás és szavazás (voksolás)",d:"A közgyűlés vitás ügyekben rendszerint felkiáltással döntött: az elnök a kiáltások alapján állapította meg a többséget. Ha ezt vitatták, el lehetett rendelni a szavazatok egyenkénti összeszedését.",n:"A szavazás nyílt volt: mindenki látta, ki hogyan szavaz, a kortes is. A szavazatszámlálás is a népesebb tábornak kedvezett."},
 megyekepviselet:{t:"megyei képviseleti rendszer",d:"Javaslat arra, hogy a vármegyében ne a közgyűlésen megjelenő összes nemes döntsön, hanem választott képviselők testülete.",n:"Az 1840-es évek reformvitájának része; a centralisták (Eötvös József, Szalay László) határozottan támogatták. A kortesvilágot és a kisnemesi tömegek befolyását akarta visszaszorítani."},
 urberiseg:{t:"úrbéri terhek",d:"A jobbágy szolgáltatásai földesurának: robot (ingyenmunka), kilenced, pénzbeli terhek.",n:"Ezek mellett állami hadiadót, házi adót és egyházi tizedet is fizetett."},
 orszaggyules:{t:"rendi országgyűlés",d:"Pozsonyban ülésező kétkamarás gyűlés: felsőtábla (főrendek) és alsótábla (vármegyei és városi követek).",n:"Az utolsó rendi országgyűlés 1847 novemberében nyílt meg."},
 rendidualizmus:{t:"rendi dualizmus",d:"A hatalom megosztása az uralkodó és a rendek (az országgyűlés) között: törvényt csak együtt hozhattak.",n:"Az egész reformkorban ez volt a magyar politikai rendszer kerete."},
 nador:{t:"nádor",d:"A király magyarországi helyettese, a rendi országgyűlés felsőtáblájának és a Helytartótanácsnak az elnöke.",n:"Az alsótáblán a személynök elnökölt."},
 reformorszaggyules:{t:"reformországgyűlések",d:"A reformkor kulcs-országgyűlései: 1825–27, 1832–36 (az első reformországgyűlés), 1839–40, 1843–44.",n:"1825–27: Akadémia-alapítás; 1839–40: önkéntes örökváltság; 1843–44: magyar államnyelv."},
 szavazatszamlalas:{t:"személyenkénti szavazás (1819)",d:"1819-től a vármegyei közgyűlésen a szavazatokat személyenként számolták, nem mérlegelték.",n:"Így minden nemes szava egyenlő lett, ezért érte meg a korteseknek tömegesen mozgósítani a kisnemességet."},
 vegrehajtas:{t:"a végrehajtás megtagadása",d:"A vármegye önálló jogköre: a törvénytelennek tartott királyi rendeletet nem hajtotta végre. Ide tartozott az adószedés és a bíráskodás is.",n:"Ezért volt a vármegye a királyi hatalom hatékony ellenpólusa."},
 hitel:{t:"Hitel (1830)",d:"Széchenyi István műve; megjelenése a reformkor kezdete. Az ősiséget és a hitelhiányt nevezi a gazdasági elmaradás okának.",n:"Folytatásai: Világ (1831), Stádium (1833)."},
 szerves:{t:"szerves fejlődés",d:"Széchenyi reformútja: óvatos, fokozatos átalakulás az arisztokrácia vezetésével, Béccsel egyetértésben.",n:"Kossuth gyorsabb, a nyilvánosságra és a köznemességre építő útjával szemben."},
 keletnepe:{t:"Kelet Népe (1841)",d:"Széchenyi vitairata Kossuth ellen: szerinte a Pesti Hírlap izgatása forradalomba sodorhatja az országot.",n:"Az 1841-es Széchenyi–Kossuth vita kezdete; a liberális többség Kossuthnak adott igazat."},
 polgariatalakulas:{t:"polgári átalakulás",d:"A rendi társadalom felváltása jogegyenlőségen, szabad tulajdonon és képviseleten alapuló renddel.",n:"Széchenyi és Kossuth célja azonos volt, eszközük eltérő: lassú vagy gyors reform."},
 kolera:{t:"kolerafelkelés (1831)",d:"A kolerajárvány idején kitört felvidéki parasztfelkelés; a hatóságokat a kút megmérgezésével vádolták.",n:"Utána a jobbágykérdés a reformpolitika középpontjába került."},

 s2a:{time:"Este 8",place:"A bor folyik",

 s2b:{time:"Este 8",place:"Kérdések a kancsó fölött",

 s3b:{time:"Éjfél",place:"Ormós táblabíró háza",

 s4b:{time:"Hajnal",place:"A jobbágy az út szélén",

let st;
function fresh(){return{scene:"s1",phase:"start",score:0,max:0,inf:0,vote:null,motives:{},testedV:[],usedQ:[],path:[],quiz:null,refl:null,name:""}}
st=(window.claude&&window.claude.hot&&window.claude.hot.data&&window.claude.hot.data.st)||fresh();
try{window.claude?.hot?.snapshot?.(()=>({st}))}catch(e){}

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mark=t=>esc(t).replace(/\[\[(.+?)\|(\w+)\]\]/g,(m,txt,id)=>`<button type="button" class="v" data-v="${id}">${txt}</button>`);
const tags=t=>[...(t||"").matchAll(/\|(\w+)\]\]/g)].map(m=>m[1]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fold=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>fold(s.trim()).replace(/\s+/g," ").replace(/[.!?,;:]+$/,"");
const smooth=()=>matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth";

function setScore(){$("#score").textContent=`${st.score} pont`}
function drawClock(){
  const c=$("#clock");
  if(st.phase==="start"){c.hidden=true;return}
  c.hidden=false;
  const cur=st.phase==="refl"||st.phase==="done"?STOPS.length-1:STOPS.indexOf(S[st.scene].time);
  c.innerHTML=STOPS.map((t,i)=>`<div class="stop ${i<cur?"done":i===cur?"now":""}"><i></i>${t}</div>`).join("");
}

function pickQuiz(vlist){
  const isFresh=v=>!st.testedV.includes(v);
  const cand=Q.map((q,i)=>({...q,i})).filter(q=>!st.usedQ.includes(q.i));
  const pref=[...new Set(vlist)];
  const sc=q=>(pref.includes(q.v)?2:0)+(isFresh(q.v)?3:0)+Math.random();
  const typed=cand.filter(q=>q.type==="type").sort((a,b)=>sc(b)-sc(a))[0];
  const mc=cand.filter(q=>q.type==="mc"&&(!typed||q.v!==typed.v)).sort((a,b)=>sc(b)-sc(a))[0];
  const out=[mc,typed].filter(Boolean);
  out.forEach(q=>{st.usedQ.push(q.i);if(!st.testedV.includes(q.v))st.testedV.push(q.v)});
  return out.map(q=>({...q,opts:q.opts?shuffle(q.opts):null,pts:q.type==="type"?2:1,done:false,got:0,given:null}));
}

function render(){
  setScore();drawClock();
  if(st.phase==="start")return renderStart();
  if(st.phase==="refl")return renderRefl();
  if(st.phase==="done")return renderDone();
  renderScene();
}

function endingFor(){

function renderScene(){
  const sc=S[st.scene];
  if(st.scene.startsWith("end")){
    app.innerHTML=`<section class="card fade story"><div><div class="meta">${sc.time} · A vármegye döntött</div><h2>${sc.place}</h2></div><p class="lede">${mark(sc.text)}</p>

  const picked=st.quiz?st.quiz.choice:null;
  let h=`<section class="card fade story"><div><div class="meta">${sc.time} · ${st.path.length+1}. döntés a hatból</div><h2>${sc.place}</h2></div><p class="lede">${mark(sc.text)}</p></section>

  if(st.quiz){

  app.innerHTML=h;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=e=>{

    const i=+b.dataset.c, c=sc.choices[i];

    st.motives[c.m]=(st.motives[c.m]||0)+1;
    if(c.inf)st.inf+=c.inf;
    if(c.vote)st.vote=c.vote;
    st.quiz={choice:i,items:pickQuiz([...tags(sc.text),...tags(c.t),...tags(c.out)])};

  });
  bindQuiz();
  const n=$("#next");
  if(n)n.onclick=()=>{const c=sc.choices[st.quiz.choice];st.scene=c.vote?endingFor():c.next;st.quiz=null;render();window.scrollTo(0,0)};

function renderQ(q,k){
  const head=`<div class="prompt">${esc(q.q)}<span class="pts">${q.pts} p.</span></div>`;
  let body;
  if(q.type==="mc"){
    body=`<div class="opts">${q.opts.map(o=>{let cls="";if(q.done){if(o===q.a)cls="ok";else if(o===q.given)cls="no"}return`<button type="button" class="opt ${cls}" data-q="${k}" data-o="${esc(o)}" ${q.done?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`;
  }else{
    body=`<div class="typerow"><input id="in${k}" data-q="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Írd be a választ" value="${q.given!=null?esc(q.given):""}" ${q.done?"disabled":""}><button type="button" class="btn" data-check="${k}" ${q.done?"disabled":""}>Ellenőrzés</button></div>`;
  }
  const fb=q.done?`<div class="fb ${q.got?"ok":"no"}">${q.got?`Helyes, +${q.got}.`:`Nem talált. Helyesen: <b>${esc(q.a||q.acc[0])}</b>.`} ${esc(q.ex)}</div>`:"";
  return `<div class="q">${head}${body}${fb}</div>`;
}
function answer(k,val){
  const q=st.quiz.items[k]; if(q.done)return;
  q.given=val; q.done=true;
  const ok=q.type==="mc"?val===q.a:q.acc.map(norm).includes(norm(val));
  q.got=ok?q.pts:0; st.score+=q.got;
  render();
  requestAnimationFrame(()=>document.querySelectorAll(".q")[k]?.scrollIntoView({block:"nearest"}));
}
function bindQuiz(){
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.q,b.dataset.o));
  app.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{const k=+b.dataset.check,v=$("#in"+k).value;if(v.trim())answer(k,v)});
  app.querySelectorAll(".typerow input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter"&&i.value.trim())answer(+i.dataset.q,i.value)});
}

/* ---------- Indoklás ---------- */
const RX={
 kovetutasitas:/utasitas/,kozgyules:/kozgyules/,bocskoros:/bocskor|kisnemes|hetszilvas|kutyabor/,kortes:/kortes/,
 adomentesseg:/adomentes|adot? ?fizet|kivaltsag|eloj/,kozteher:/kozteher/,haziado:/hazi ?ado/,adminisztrator:/adminisztrator/,
 konzervativ:/konzervativ/,ellenzeki:/ellenzek/,orokvaltsag:/orokvaltsag/,nepkepviselet:/nepkepvisel/,osiseg:/osiseg/,
 erdekegyesites:/erdekegyesit/,pestihirlap:/pesti hirlap/,felkialtas:/felkialt|voksol|nyilt szavaz/,rendidualizmus:/dualizmus/,nador:/nador/,reformorszaggyules:/reformorszaggyules/,szavazatszamlalas:/1819|szemelyenkent/,vegrehajtas:/vegrehajtas/,hitel:/\bhitel/,szerves:/szerves fejlod/,keletnepe:/kelet nep/,polgariatalakulas:/polgari atalakul/,kolera:/kolera/,tancsics:/tancsics/,vedegylet:/vedegylet/,allamnyelv:/allamnyelv|1844/,fiatalmo:/fiatal magyarorszag/,arisztokracia:/arisztokra|fonemes|magnas/,kozepbirtokos:/kozepbirtok|eladosod/,napoleon:/napoleon/,telekaprozodas:/telekaproz/,zseller:/zseller/,megyekepviselet:/kepviseleti rendszer|megyei kepvisel/,urberiseg:/urber|robot|kilenced/,orszaggyules:/orszaggyules|pozsony/
};
const PERSP=/jancsi|varga|jobbagy|ormos|tablabiro|idegen|kortes|jegyzo|toth|liberalis|konzervativ|reformpart|kisnemes/;
const CAUSE=/\b(mert|ezert|hiszen|mivel|ugyanis|azert|emiatt|igy)\b/;
function scoreRefl(raw){
  const t=fold(raw);
  const found=Object.keys(RX).filter(k=>RX[k].test(t));
  const words=raw.trim().split(/\s+/).filter(Boolean).length;
  const sents=(raw.match(/[.!?]+(\s|$)/g)||[]).length;
  let p=0,notes=[];
  if(found.length>=2){p+=4;notes.push("legalább két fogalom a játékból (+4)")}
  else if(found.length===1){p+=2;notes.push("egy fogalom a játékból (+2)")}
  else notes.push("nem találtam fogalmat a játékból (0)");
  if(PERSP.test(t)){p+=2;notes.push("egy másik szereplő vagy csoport nézőpontja (+2)")}
  else notes.push("nem jelenik meg más szereplő nézőpontja (0)");
  if(CAUSE.test(t)){p+=1;notes.push("ok-okozati kötőszó (+1)")}
  else notes.push("nincs ok-okozati kötőszó, pl. mert, ezért (0)");
  if(words>=15&&words<=120&&sents>=2&&sents<=5){p+=1;notes.push("2–4 mondat, megfelelő hossz (+1)")}
  else notes.push(words<15||sents<2?"túl rövid, legalább 2 mondat kell (0)":"túl hosszú, 2–4 mondat a cél (0)");
  return{p,found,notes};
}
function renderRefl(){
  const voteTxt=st.vote==="valt"?"„Változzék!”":"„Maradjon!”";
  app.innerHTML=`<section class="card fade" style="display:flex;flex-direction:column;gap:14px">
    <div class="meta">Indoklás · max. 8 pont</div>
    <h2>Cselekedtél. Miért és hogyan?</h2>

    <p style="color:var(--muted);font-size:.94rem">Pontozás: két fogalom 4 pont, egy fogalom 2 pont; másik nézőpont 2 pont; ok-okozati kötőszó (mert, ezért) 1 pont; megfelelő hossz 1 pont.</p>
    <label for="nm" class="meta" style="margin:0">Neved (a tanárnak)</label>
    <input id="nm" class="field" autocomplete="name" value="${esc(st.name)}" placeholder="Pl. Kiss Anna, 11.B">
    <label for="refl" class="meta" style="margin:0">Indoklásod</label>
    <textarea id="refl" placeholder="Azért szavaztam így, mert … Varga Jancsi szerint viszont …"></textarea>
    <div class="row"><button class="btn big wine" id="sendR" type="button">Beadom</button><span class="hint" id="rhint"></span></div>
  </section>`;
  $("#sendR").onclick=()=>{
    const v=$("#refl").value.trim();
    if(!v){$("#rhint").textContent="Írj legalább két mondatot.";return}
    st.name=$("#nm").value.trim();
    const r=scoreRefl(v); st.refl={text:v,...r}; st.score+=r.p; st.max+=8; st.phase="done"; render(); window.scrollTo(0,0);
  };
}

function renderDone(){
  const quizPts=st.score-st.refl.p, quizMax=st.max-8;
  const pct=Math.round(st.score/st.max*100);
  const verdict=pct>=85?"A megye legfelkészültebb kisnemese.":pct>=60?"Ormós táblabíró is elismerően bólintana.":pct>=35?"Biztos alap; egy újabb kör után a fogalmak is a helyükre kerülnek.":"A kortes jobban ismeri a fogalmakat. Játszd újra, és vágj vissza neki.";
  const end=S[st.scene];
  const total=Object.values(st.motives).reduce((a,b)=>a+b,0)||1;
  const mot=Object.keys(M).map(k=>({k,n:st.motives[k]||0})).sort((a,b)=>b.n-a.n);
  const summary=`A kortes bora – eredmény
Név: ${st.name||"(nem adta meg)"}
Pont: ${st.score}/${st.max} (fogalmi kvíz ${quizPts}/${quizMax}, indoklás ${st.refl.p}/8)
Szavazat: ${st.vote==="valt"?"Változzék":"Maradjon"} → ${end.place}
Döntési profil: ${mot.filter(m=>m.n).map(m=>`${M[m.k]} ${m.n}`).join(", ")}
Út: ${st.path.map(p=>p.split(": ")[1]).join(" · ")}
Indoklás: ${st.refl.text}`;
  app.innerHTML=`<section class="card fade" style="display:flex;flex-direction:column;gap:16px">
    <div class="meta">Eredmény · ${esc(end.place)}</div>
    <div class="big-score">${st.score}<span style="font-size:1.4rem;color:var(--muted)"> / ${st.max}</span></div>
    <h2 style="font-size:1.4rem">${verdict}</h2>
    <div class="tally"><span>Fogalmi próba (${st.usedQ.length} kérdés)</span><span>${quizPts} / ${quizMax}</span><span>Indoklás</span><span>${st.refl.p} / 8</span></div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="meta">Döntési profilod</div>
    <p style="color:var(--muted);font-size:.95rem">Mi vezette a hat döntésedet? Ez nem pontszám, hanem beszélgetési alap: milyen indítékok mozgatták a reformkori kisnemest?</p>
    <div class="motives">${mot.map(m=>`<div class="mot"><span>${M[m.k]}</span><span class="track"><i style="width:${Math.round(m.n/total*100)}%"></i></span><span class="n">${m.n}</span></div>`).join("")}</div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="meta">Indoklásod</div>
    <p><i>„${esc(st.refl.text)}”</i></p>
    ${st.refl.found.length?`<div class="tags">${st.refl.found.map(k=>`<span>${esc(V[k].t)}</span>`).join("")}</div>`:""}
    <ul class="path" style="color:var(--ink)">${st.refl.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
    <p style="color:var(--muted);font-size:.9rem">A gép csak azt nézi, szerepelnek-e a fogalmak és a nézőpontok. Az érvelés minőségét a tanár értékeli.</p>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="meta">Az utad estétől délig</div>
    <ul class="path">${st.path.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="copy" type="button">Eredmény másolása</button>
      <button class="btn wine" id="again" type="button">Újra játszom</button>
      <span class="hint" id="chint"></span>
    </div>
    <textarea id="sum" readonly hidden>${esc(summary)}</textarea>
  </section>`;
  $("#again").onclick=()=>{const nm=st.name;st=fresh();st.name=nm;st.phase="scene";render();window.scrollTo(0,0)};
  $("#copy").onclick=()=>{
    const ok=()=>$("#chint").textContent="Kimásolva, beillesztheted a tanárnak küldött üzenetbe.";
    const fallback=()=>{const s=$("#sum");s.hidden=false;s.select();$("#chint").textContent="Jelöld ki és másold ki a szöveget."};
    try{navigator.clipboard.writeText(summary).then(ok,fallback)}catch(e){fallback()}
  };
}

/* ---------- Fogalom-buborék és Fogalomtár ---------- */
const tip=$("#tip");
document.addEventListener("click",e=>{
  const b=e.target.closest(".v[data-v]"); if(!b)return;
  e.stopPropagation();
  const v=V[b.dataset.v];
  tip.innerHTML=`<div><b>${esc(v.t)}</b>: ${esc(v.d)}<br><span style="opacity:.8;font-size:.88rem">${esc(v.n)}</span></div><button type="button" aria-label="Bezár">×</button>`;
  tip.hidden=false; tip.querySelector("button").onclick=()=>tip.hidden=true;
  clearTimeout(tip._t); tip._t=setTimeout(()=>tip.hidden=true,9000);
},true);
$("#glossList").innerHTML=G.map(([h,ids])=>`<h3 class="gh">${esc(h)}</h3>`+ids.map(k=>V[k]).map(v=>`<div><span class="t">${esc(v.t)}</span><span>${esc(v.d)}</span><span class="n">${esc(v.n)}</span></div>`).join("")).join("");
$("#glossBtn").onclick=()=>{const g=$("#glossary");g.hidden=!g.hidden;if(!g.hidden)g.scrollIntoView({block:"start"})};
$("#glossClose").onclick=()=>{$("#glossary").hidden=true;window.scrollTo(0,0)};

render();
</script>

</body></html>
